# Session services (start once)
exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --nofork
exec --no-startup-id nm-applet

exec --no-startup-id "$script_path/i3-startup.sh && exec $script_path/mousemove.sh"
exec --no-startup-id 'unclutter'
exec --no-startup-id dunst
exec --no-startup-id autotiling
exec --no-startup-id i3-msg 'exec flameshot'
exec --no-startup-id i3-msg 'workspace $ws2; exec pavucontrol'
exec --no-startup-id i3-msg 'exec flatpak run dev.vencord.Vesktop'
exec --no-startup-id i3-msg 'workspace $ws4; exec google-chrome-stable; exec lutris'

exec --no-startup-id i3-msg 'exec steam; workspace $ws9, append_layout ~/.i3/workspace-1.json; workspace $ws9'
exec --no-startup-id i3-msg 'workspace $ws12; exec firefox; workspace $ws1'
exec --no-startup-id i3-msg 'exec caffeine'
exec --no-startup-id thunar

# Reapply wallpaper on reload
exec_always --no-startup-id feh --bg-fill $bg/pexels-jaime-reimer-1376930-2662116.jpg
