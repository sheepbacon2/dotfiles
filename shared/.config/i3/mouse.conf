# Mouse control modes
set $mousepipe /tmp/mousepipe

mode "mousepos" {
    bindsym 1 exec --no-startup-id $script_path/mousepos.sh 1
    bindsym 2 exec --no-startup-id $script_path/mousepos.sh 2
    bindsym 3 exec --no-startup-id $script_path/mousepos.sh 3
    bindsym 4 exec --no-startup-id $script_path/mousepos.sh 4
    bindsym 5 exec --no-startup-id $script_path/mousepos.sh 5
    bindsym 6 exec --no-startup-id $script_path/mousepos.sh 6
    bindsym 7 exec --no-startup-id $script_path/mousepos.sh 7
    bindsym 8 exec --no-startup-id $script_path/mousepos.sh 8
    bindsym 9 exec --no-startup-id $script_path/mousepos.sh 9
    bindsym space mode "mouseposClick", exec --no-startup-id notify-send Click Mode -t 1000

    bindsym w          exec --no-startup-id echo w > $mousepipe
    bindsym a          exec --no-startup-id echo a > $mousepipe
    bindsym s          exec --no-startup-id echo s > $mousepipe
    bindsym d          exec --no-startup-id echo d > $mousepipe

    bindsym Shift+w    exec --no-startup-id echo W > $mousepipe
    bindsym Shift+a    exec --no-startup-id echo A > $mousepipe
    bindsym Shift+s    exec --no-startup-id echo S > $mousepipe
    bindsym Shift+d    exec --no-startup-id echo D > $mousepipe
    bindsym Shift+Return exec --no-startup-id echo rclick > $mousepipe
    bindsym Up    exec --no-startup-id echo sup > $mousepipe
    bindsym Down  exec --no-startup-id echo sdown > $mousepipe
    bindsym Return     exec --no-startup-id echo Return > $mousepipe
    bindsym f exec --no-startup-id $script_path/timescript.sh
    # exit mode
    bindsym Escape mode "default"
}

mode "mouseposClick" {
    bindsym 1 exec --no-startup-id $script_path/click.sh 1
    bindsym 2 exec --no-startup-id $script_path/click.sh 2
    bindsym 3 exec --no-startup-id $script_path/click.sh 3
    bindsym 4 exec --no-startup-id $script_path/click.sh 4
    bindsym 5 exec --no-startup-id $script_path/click.sh 5
    bindsym 6 exec --no-startup-id $script_path/click.sh 6
    bindsym 7 exec --no-startup-id $script_path/click.sh 7
    bindsym 8 exec --no-startup-id $script_path/click.sh 8
    bindsym 9 exec --no-startup-id $script_path/click.sh 9
    bindsym Escape mode "default"
    bindsym space mode "mousepos", exec --no-startup-id notify-send Save Mode -t 1000
    bindsym w          exec --no-startup-id echo w > $mousepipe
    bindsym a          exec --no-startup-id echo a > $mousepipe
    bindsym s          exec --no-startup-id echo s > $mousepipe
    bindsym d          exec --no-startup-id echo d > $mousepipe

    bindsym Shift+w    exec --no-startup-id echo W > $mousepipe
    bindsym Shift+a    exec --no-startup-id echo A > $mousepipe
    bindsym Shift+s    exec --no-startup-id echo S > $mousepipe
    bindsym Shift+d    exec --no-startup-id echo D > $mousepipe

    bindsym Shift+Return exec --no-startup-id echo rclick > $mousepipe
    bindsym Up    exec --no-startup-id echo sup > $mousepipe
    bindsym Down  exec --no-startup-id echo sdown > $mousepipe

    bindsym Return     exec --no-startup-id echo Return > $mousepipe
    bindsym f exec --no-startup-id $script_path/timescript.sh
}
# Enter mouse click mode
bindsym $mod+Shift+semicolon mode "mouseposClick", exec --no-startup-id notify-send Click Mode -t 1000
