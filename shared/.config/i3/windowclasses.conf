# ---- Discord scratchpad setup ----

# Mark Discord when it appears
for_window [class="^dev[.]vencord[.]Vesktop$"] mark discord_scratchpad
for_window [class="(?i)^Thunar$" window_type="normal"] floating enable
for_window [class="firefox" title="Library"] floating enable
for_window [workspace=$ws12] layout tabbed
for_window [workspace=$ws4] layout tabbed
#window workspace setting
assign [class="thunderbird"] workspace $ws10
assign [class="^dev[.]vencord[.]Vesktop$"] workspace $ws13
assign [class="vlc"] workspace $ws16
assign [class="qBittorrent"] workspace $ws17
assign [class="Bitwarden"] $ws18
assign [class="steam"] workspace $ws9
for_window [class="^steam_app_1623730$" title="^Pal  $"] move to workspace $ws8
for_window [title="Python Turtle Graphics" class="(?i)Tk"] floating enable
for_window [instance="tk" class="(?i)Tk"] floating enable
