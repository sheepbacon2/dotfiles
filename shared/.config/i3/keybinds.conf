# Terminal, launcher, and window close
bindsym $mod+Return exec alacritty
bindsym $mod+Shift+q kill
bindsym $mod+d exec --no-startup-id $HOME/.config/rofi/launchers/type-1/launcher.sh

# mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent
bindsym $mod+z move workspace to output $fm | $sm

# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart
# exit i3 (logs you out of your X session)
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"
bindsym $mod+semicolon split vertical
bindsym $mod+g split horizontal
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status ; exec pkill -SIGRTMIN+10 i3blocks
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status; exec pkill -SIGRTMIN+10 i3blocks
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status; exec pkill -SIGRTMIN+10 i3blocks
bindsym $mod+End exec --no-startup-id $HOME/.config/i3blocks/scripts/powermenu/powermenu.sh
bindsym $mod+Print exec --no-startup-id "flameshot gui"
bindsym Print exec scrot $HOME/Pictures/ScreenShots/`date +%Y-%m-%d_%H:%M:%S`.png
bindsym $mod+r exec alacritty -e "ranger"
bindsym $mod+KP_Insert mark moveme
bindsym $mod+Shift+KP_Insert [con_mark=moveme] move container to workspace current; [con_mark=moveme] focus
bindsym $mod+q exec --no-startup-id ~/.local/bin/i3-scratch-toggle thunar_scratchpad '[con_id="__focused__" class="(?i)^Thunar$"]'
include $HOME/.config/i3/hardware.conf
bindsym $mod+F2 exec --no-startup-id $script_path/vsync_toggle.py
bindsym $mod+F5 exec --no-startup-id $script_path/mousepos.sh
bindsym $mod+F4 exec --no-startup-id $script_path/nordvpnc.sh
bindsym $mod+F6 exec --no-startup-id $script_path/click.sh
bindsym $mod+F9 exec "killall picom"
