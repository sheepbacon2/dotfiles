# Application, movement, and workspace save/restore modes
set $mode_launcher Launch: [f]irefox [p]rivate [d]iscord [t]hunar [s]team
set $mode_kill Kill
set $mode_move Move
set $i3_resurrect i3-resurrect
set $save workspace save
set $restore workspace restore

# Enter launcher directly; the existing Mod+Menu opens Save.
bindsym $mod+Shift+d mode "$mode_launcher"

mode "$mode_launcher" {
    bindsym t exec thunar
    bindsym f exec firefox
    bindsym p exec librewolf
    bindsym d exec --no-startup-id "flatpak run dev.vencord.Vesktop"
    bindsym s exec --no-startup-id i3-msg workspace $ws9, append_layout ~/.i3/workspace-1.json,  exec --no-startup-id steam
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym m mode "$mode_move"
    bindsym q mode "$mode_kill"
    bindsym w mode "$save"
    bindsym r mode "$restore"
}
mode "$mode_kill" {
    bindsym q kill
    bindsym j focus down
    bindsym k focus up
    bindsym l focus right
    bindsym h focus left
    bindsym m mode "$mode_move"
    bindsym d mode "$mode_launcher"
    bindsym w mode "$save"
    bindsym r mode "$restore"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
mode "$mode_move" {
    bindsym j focus down
    bindsym k focus up
    bindsym l focus right
    bindsym h focus left
    bindsym 1 move container to workspace $ws1
    bindsym 2 move container to workspace $ws2
    bindsym 3 move container to workspace $ws3
    bindsym 4 move container to workspace $ws4
    bindsym 5 move container to workspace $ws5
    bindsym 6 move container to workspace $ws6
    bindsym 7 move container to workspace $ws7
    bindsym 8 move container to workspace $ws8
    bindsym 9 move container to workspace $ws9
    bindsym 0 move container to workspace $ws10
    bindsym z move container to workspace $ws11
    bindsym x move container to workspace $ws12
    bindsym b move container to workspace $ws14
    bindsym n move container to workspace $ws15
    bindsym m move container to workspace $ws16
    bindsym y move container to workspace $ws17
    bindsym p move container to workspace $ws18
    #move external monitor workspaces
    bindsym $mod+1 move container to workspace $ws19
    bindsym $mod+2 move container to workspace $ws20
    bindsym $mod+3 move container to workspace $ws21
    bindsym $mod+4 move container to workspace $ws22
    bindsym $mod+5 move container to workspace $ws23
    bindsym $mod+6 move container to workspace $ws24
    bindsym $mod+7 move container to workspace $ws25
    bindsym $mod+8 move container to workspace $ws26
    bindsym $mod+9 move container to workspace $ws27
    bindsym $mod+0 move container to workspace $ws28
    bindsym d mode "$mode_launcher"
    bindsym q mode "$mode_kill"
    bindsym w mode "$save"
    bindsym r mode "$restore"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Save workspace mode.
bindsym $mod+Menu mode "$save"
mode "$save" {
    bindsym 1 exec $i3_resurrect save -w $ws1 --swallow="class,instance,title"
    bindsym 2 exec $i3_resurrect save -w $ws2 --swallow="class,instance,title"
    bindsym 3 exec $i3_resurrect save -w $ws3 --swallow="class,instance,title"
    bindsym 4 exec $i3_resurrect save -w $ws4 --swallow="class,instance,title"
    bindsym 5 exec $i3_resurrect save -w $ws5 --swallow="class,instance,title"
    bindsym 6 exec $i3_resurrect save -w $ws6 --swallow="class,instance,title"
    bindsym 7 exec $i3_resurrect save -w $ws7 --swallow="class,instance,title"
    bindsym 8 exec $i3_resurrect save -w $ws8 --swallow="class,instance,title"
    bindsym 9 exec $i3_resurrect save -w $ws9 --swallow="class,instance,title"
    bindsym 0 exec $i3_resurrect save -w $ws10 --swallow="class,instance,title"
    bindsym z exec $i3_resurrect save -w $ws11 --swallow="class,instance,title"
    bindsym x exec $i3_resurrect save -w $ws12 --swallow="class,instance,title"
    bindsym c exec $i3_resurrect save -w $ws13 --swallow="class,instance,title"
    bindsym b exec $i3_resurrect save -w $ws14 --swallow="class,instance,title"
    bindsym n exec $i3_resurrect save -w $ws15 --swallow="class,instance,title"
    bindsym y exec $i3_resurrect save -w $ws17 --swallow="class,instance,title"
    bindsym p exec $i3_resurrect save -w $ws18 --swallow="class,instance,title"
    #second monitor workspace switch
    bindsym $mod+1 exec $i3_resurrect save -w $ws19 --swallow="class,instance,title"
    bindsym $mod+2 exec $i3_resurrect save -w $ws20 --swallow="class,instance,title"
    bindsym $mod+3 exec $i3_resurrect save -w $ws21 --swallow="class,instance,title"
    bindsym $mod+4 exec $i3_resurrect save -w $ws22 --swallow="class,instance,title"
    bindsym $mod+5 exec $i3_resurrect save -w $ws23 --swallow="class,instance,title"
    bindsym $mod+6 exec $i3_resurrect save -w $ws24 --swallow="class,instance,title"
    bindsym $mod+7 exec $i3_resurrect save -w $ws25 --swallow="class,instance,title"
    bindsym $mod+8 exec $i3_resurrect save -w $ws26 --swallow="class,instance,title"
    bindsym $mod+9 exec $i3_resurrect save -w $ws27 --swallow="class,instance,title"
    bindsym $mod+0 exec $i3_resurrect save -w $ws28 --swallow="class,instance,title"
    bindsym d mode "$mode_launcher"
    bindsym q mode "$mode_kill"
    bindsym m mode "$mode_move"
    bindsym r mode "$restore"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Restore workspace mode.
mode "$restore" {
    bindsym 1 exec $i3_resurrect restore -w $ws1 --programs-only
    bindsym 2 exec $i3_resurrect restore -w $ws2 --programs-only
    bindsym 3 exec $i3_resurrect restore -w $ws3 --programs-only
    bindsym 4 exec $i3_resurrect restore -w $ws4 --programs-only
    bindsym 5 exec $i3_resurrect restore -w $ws5 --programs-only
    bindsym 6 exec $i3_resurrect restore -w $ws6 --programs-only
    bindsym 7 exec $i3_resurrect restore -w $ws7 --programs-only
    bindsym 8 exec $i3_resurrect restore -w $ws8 --programs-only
    bindsym 9 exec $i3_resurrect restore -w $ws9 --programs-only
    bindsym 0 exec $i3_resurrect restore -w $ws10 --programs-only
    bindsym z exec $i3_resurrect restore -w $ws11 --programs-only
    bindsym x exec $i3_resurrect restore -w $ws12 --programs-only
    bindsym c exec $i3_resurrect restore -w $ws13 --programs-only
    bindsym b exec $i3_resurrect restore -w $ws14 --programs-only
    bindsym n exec $i3_resurrect restore -w $ws15 --programs-only
    bindsym y exec $i3_resurrect restore -w $ws17 --programs-only
    bindsym p exec $i3_resurrect restore -w $ws18 --programs-only
    #second monitor workspace switch
    bindsym Mod1+1 exec $i3_resurrect restore -w $ws19 --programs-only
    bindsym Mod1+2 exec $i3_resurrect restore -w $ws20 --programs-only
    bindsym Mod1+3 exec $i3_resurrect restore -w $ws21 --programs-only
    bindsym Mod1+4 exec $i3_resurrect restore -w $ws22 --programs-only
    bindsym Mod1+5 exec $i3_resurrect restore -w $ws23 --programs-only
    bindsym Mod1+6 exec $i3_resurrect restore -w $ws24 --programs-only
    bindsym Mod1+7 exec $i3_resurrect restore -w $ws25 --programs-only
    bindsym Mod1+8 exec $i3_resurrect restore -w $ws26 --programs-only
    bindsym Mod1+9 exec $i3_resurrect restore -w $ws27 --programs-only
    bindsym Mod1+0 exec $i3_resurrect restore -w $ws28 --programs-only

    bindsym $mod+1 exec $i3_resurrect restore -w $ws1 --layout-only
    bindsym $mod+2 exec $i3_resurrect restore -w $ws2 --layout-only
    bindsym $mod+3 exec $i3_resurrect restore -w $ws3 --layout-only
    bindsym $mod+4 exec $i3_resurrect restore -w $ws4 --layout-only
    bindsym $mod+5 exec $i3_resurrect restore -w $ws5 --layout-only
    bindsym $mod+6 exec $i3_resurrect restore -w $ws6 --layout-only
    bindsym $mod+7 exec $i3_resurrect restore -w $ws7 --layout-only
    bindsym $mod+8 exec $i3_resurrect restore -w $ws8 --layout-only
    bindsym $mod+9 exec $i3_resurrect restore -w $ws9 --layout-only
    bindsym $mod+0 exec $i3_resurrect restore -w $ws10 --layout-only
    bindsym $mod+z exec $i3_resurrect restore -w $ws11 --layout-only
    bindsym $mod+x exec $i3_resurrect restore -w $ws12 --layout-only
    bindsym $mod+c exec $i3_resurrect restore -w $ws13 --layout-only
    bindsym $mod+b exec $i3_resurrect restore -w $ws14 --layout-only
    bindsym $mod+n exec $i3_resurrect restore -w $ws15 --layout-only
    bindsym Mod1+Shift+1 exec $i3_resurrect restore -w $ws19 --layout-only
    bindsym Mod1+Shift+2 exec $i3_resurrect restore -w $ws20 --layout-only
    bindsym Mod1+Shift+3 exec $i3_resurrect restore -w $ws21 --layout-only
    bindsym Mod1+Shift+4 exec $i3_resurrect restore -w $ws22 --layout-only
    bindsym Mod1+Shift+5 exec $i3_resurrect restore -w $ws23 --layout-only
    bindsym Mod1+Shift+6 exec $i3_resurrect restore -w $ws24 --layout-only
    bindsym Mod1+Shift+7 exec $i3_resurrect restore -w $ws25 --layout-only
    bindsym Mod1+Shift+8 exec $i3_resurrect restore -w $ws26 --layout-only
    bindsym Mod1+Shift+9 exec $i3_resurrect restore -w $ws27 --layout-only
    bindsym Mod1+Shift+0 exec $i3_resurrect restore -w $ws28 --layout-only

    # Return to the default mode with Enter or Escape
    bindsym d mode "$mode_launcher"
    bindsym q mode "$mode_kill"
    bindsym m mode "$mode_move"
    bindsym w mode "$save"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
