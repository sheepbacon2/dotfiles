# Scratchpads and window organization
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus exec --no-startup-id ~/.local/bin/i3-show-unmarked-scratchpads
# Move/organize windows
bindsym $mod+KP_End \
    [class="(?i)firefox" title="(?i).*dashboard.*"] move to workspace $ws18; \
    [class="(?i)firefox" title="(?i).*whatsapp.*"] mark --add moveme, move scratchpad; \
    [title="(?i).*spanish library home.*"] move to workspace $ws1; \
    [title="(?i).*netflix.*"] move to workspace $ws16; \
    [title="(?i).*spanishdictionary.*"] move to workspace $ws1; \
    [title="(?i).*gmail.*"] move to workspace $ws10; \
    [title="(?i).*spanishwordslist.*"] move to workspace $ws1; \
    [title="(?i).*wordreference.*"] move to workspace $ws1; \
    [title="(?i).*spanish translator.*"] move to workspace $ws1; \
    [title="(?i).*udemy.*"] move to workspace $ws3; \
    [title="(?i).*log in | ring.*"] move to workspace $ws18; \
    [class="(?i)firefox" title="(?i).*netflix.*"] move to workspace $ws16; \
    [class="(?i)firefox" title="(?i).*crunchyroll.*"] move to workspace $ws16; \
    [title="(?i).*youtube.*"] move to workspace $ws16; \
    [title="(?i).*chronodex.*"] move to workspace $ws4; \
    [title="(?i).*frigate.*"] move to workspace $ws18

# WhatsApp / generic scratchpad
# If moveme exists: show/hide it.
# If moveme does not exist: mark focused window as moveme and move it to scratchpad.
bindsym $mod+v exec --no-startup-id ~/.local/bin/i3-scratch-toggle moveme '[con_id="__focused__" con_mark="^moveme$"]'

# Force current focused window to become the only moveme scratchpad
bindsym $mod+Shift+v [con_mark="moveme"] unmark moveme; mark --add moveme, move scratchpad

# Remove all marks from the focused window
bindsym $mod+u [con_id="__focused__"] unmark

# Discord scratchpad
bindsym $mod+c exec --no-startup-id ~/.local/bin/i3-scratch-toggle discord_scratchpad '[con_id="__focused__" class="^dev[.]vencord[.]Vesktop$"]'

# Movie scratchpad
bindsym $mod+n exec --no-startup-id ~/.local/bin/i3-scratch-toggle movie '[con_id="__focused__" con_mark="^movie$"]'

# Force focused window to become the only movie scratchpad
bindsym $mod+Shift+n [con_mark="movie"] unmark movie; mark --add movie, move scratchpad
bindsym $mod+b bar mode toggle
bindsym $mod+KP_Down [con_mark="^moveme$"] floating disable, move down, move left, resize set width 1000 px
